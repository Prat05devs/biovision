[project]
name = "biovision-backend"
version = "0.1.0"
description = "Safety-constrained BioVision screening and care-navigation API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "pillow>=11.3,<13",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
models = [
  "numpy>=2,<3",
  "opencv-python-headless>=4.12,<5",
  "timm>=1,<2",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
